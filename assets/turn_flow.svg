<svg viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #1f2937; }
    .label { font-size: 13px; font-style: italic; font-weight: 600; }
    .box-title { font-size: 15px; font-weight: 700; fill: #1f2937; }
    .box-sub { font-size: 12px; fill: #4b5563; }
    .caption { font-size: 13px; font-style: italic; fill: #4b5563; }
    .flow-note { font-size: 13px; font-style: italic; fill: #4b5563; }
  </style>

  <text x="450" y="34" text-anchor="middle" class="title">One Conversational Turn (host pipeline)</text>

  <!-- layer labels -->
  <text x="130" y="72" text-anchor="middle" class="label" fill="#7c3aed">[router]</text>
  <text x="340" y="72" text-anchor="middle" class="label" fill="#d97706">[planner]</text>
  <text x="550" y="72" text-anchor="middle" class="label" fill="#059669">[orchestrator]</text>
  <text x="770" y="72" text-anchor="middle" class="label" fill="#dc2626">[narration]</text>

  <!-- boxes -->
  <rect x="55" y="82" width="150" height="86" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="130" y="112" text-anchor="middle" class="box-title">Route</text>
  <text x="130" y="132" text-anchor="middle" class="box-sub">LLM classifies intent</text>
  <text x="130" y="148" text-anchor="middle" class="box-sub">into ONE domain</text>

  <rect x="265" y="82" width="150" height="86" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="340" y="112" text-anchor="middle" class="box-title">Plan</text>
  <text x="340" y="132" text-anchor="middle" class="box-sub">tool + args, validated</text>
  <text x="340" y="148" text-anchor="middle" class="box-sub">against schemas</text>

  <rect x="475" y="82" width="150" height="86" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2.5"/>
  <text x="550" y="112" text-anchor="middle" class="box-title">Execute</text>
  <text x="550" y="132" text-anchor="middle" class="box-sub">code calls MCP tools,</text>
  <text x="550" y="148" text-anchor="middle" class="box-sub">identity injected</text>

  <rect x="695" y="82" width="150" height="86" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="770" y="112" text-anchor="middle" class="box-title">Narrate</text>
  <text x="770" y="132" text-anchor="middle" class="box-sub">LLM speaks from</text>
  <text x="770" y="148" text-anchor="middle" class="box-sub">labeled facts only</text>

  <!-- arrows -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#374151"/>
    </marker>
    <marker id="arrd" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <line x1="205" y1="125" x2="258" y2="125" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="415" y1="125" x2="468" y2="125" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="625" y1="125" x2="688" y2="125" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- domain servers row -->
  <rect x="415" y="216" width="270" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="550" y="238" text-anchor="middle" class="box-title" font-size="14">MCP domain servers</text>
  <text x="550" y="256" text-anchor="middle" class="box-sub">bounded contexts: services own the logic</text>

  <line x1="550" y1="168" x2="550" y2="209" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="596" y1="209" x2="596" y2="176" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrd)"/>
  <text x="612" y="196" class="flow-note">domain events</text>

  <!-- session state note -->
  <path d="M 130 168 L 130 200 Q 130 214 144 214 L 380 214" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="140" y="238" class="flow-note">session loaded once at turn start (AccessContext + SlotState),</text>
  <text x="140" y="256" class="flow-note">saved once at turn end — history + note ride into narration</text>

  <text x="30" y="310" class="caption">Two LLM calls per turn (merged in production mode). The LLM interprets; code guarantees.</text>
</svg>
