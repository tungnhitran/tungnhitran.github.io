<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 21px; font-weight: 700; fill: #1f2937; }
    .label { font-size: 13px; font-style: italic; font-weight: 600; }
    .box-title { font-size: 14px; font-weight: 700; fill: #1f2937; }
    .box-sub { font-size: 12px; fill: #4b5563; }
    .caption { font-size: 13px; font-style: italic; fill: #4b5563; }
    .axis { font-size: 12px; fill: #6b7280; }
  </style>

  <text x="450" y="34" text-anchor="middle" class="title">The U-Curve — and the Note That Can't Be Evicted</text>

  <!-- U curve -->
  <path d="M 90 90 Q 200 90 280 170 Q 450 260 620 170 Q 700 90 810 90"
        fill="none" stroke="#7c3aed" stroke-width="3.5"/>
  <text x="90" y="76" class="axis" font-weight="600" fill="#7c3aed">recall: strong</text>
  <text x="450" y="242" text-anchor="middle" class="axis" font-weight="600" fill="#7c3aed">recall: weak (the valley)</text>
  <text x="810" y="76" text-anchor="end" class="axis" font-weight="600" fill="#7c3aed">recall: strong</text>

  <!-- prompt strip -->
  <text x="90" y="286" class="label" fill="#6b7280">[the prompt, start → end]</text>
  <rect x="90"  y="296" width="130" height="52" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="155" y="318" text-anchor="middle" class="box-sub" font-weight="700">system rules</text>
  <text x="155" y="335" text-anchor="middle" class="box-sub">grounding, tone</text>

  <rect x="230" y="296" width="200" height="52" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="330" y="318" text-anchor="middle" class="box-sub" font-weight="700">older history (windowed)</text>
  <text x="330" y="335" text-anchor="middle" class="box-sub">early facts sink here — then evict</text>

  <rect x="440" y="296" width="160" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="520" y="318" text-anchor="middle" class="box-sub" font-weight="700">recent turns</text>
  <text x="520" y="335" text-anchor="middle" class="box-sub">real chat messages</text>

  <rect x="610" y="296" width="180" height="52" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2.5"/>
  <text x="700" y="318" text-anchor="middle" class="box-sub" font-weight="700">structured note — LAST</text>
  <text x="700" y="335" text-anchor="middle" class="box-sub">re-injected every turn</text>

  <!-- note callout -->
  <defs>
    <marker id="arr4" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
  <line x1="700" y1="296" x2="740" y2="110" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr4)"/>
  <text x="640" y="140" class="caption" fill="#059669">sits at the strong end of the curve —</text>
  <text x="640" y="158" class="caption" fill="#059669">built in code, window can't evict it</text>

  <text x="30" y="382" class="caption">Presence ≠ recall: models read the middle of long contexts worst (Liu et al., "Lost in the Middle"). So the working memory goes last, deterministically.</text>
</svg>
