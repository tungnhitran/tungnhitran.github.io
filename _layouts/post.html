---
layout: default
---
<div class="post-grid">
  <article class="post">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%B %-d, %Y" }}
      {% if page.tags %} · {% for t in page.tags %}<span class="chip">{{ t }}</span>{% endfor %}{% endif %}
    </p>
    <div class="post-body">
      {{ content }}
    </div>
    <hr>
    <p class="post-nav"><a href="{{ '/' | relative_url }}">← All posts</a></p>
  </article>
  <aside class="post-side">
    {% include toc.html %}
  </aside>
</div>
